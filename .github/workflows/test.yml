name: Test

on:
  pull_request:
    branches:
      - main
    paths:
      - 'convex/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm test
